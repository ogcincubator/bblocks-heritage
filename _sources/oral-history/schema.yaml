$schema: https://json-schema.org/draft/2020-12/schema
title: Oral History
description: >-
  An audio or video oral history recording or community narrative. Profiles
  digital-representation (CIDOC-CRM E73 Information Object) and adds mandatory fields for
  interviewee, language, consent status and IIIF manifest, with optional schema.org
  AudioObject/VideoObject alignment for web-visible metadata.
x-jsonld-context: context.jsonld
allOf:
  - $ref: bblocks://ogc.heritage.digital-representation
  - type: object
    required:
      - type
      - interviewee
      - language
      - consentStatus
      - iiifManifest
      - mediaType
      - rights
    properties:
      type:
        const: OralHistory
        description: Fixed type token (maps to crm:E73_Information_Object).
      title:
        type: string
        description: Human-readable title of the recording (dct:title).
      interviewee:
        type: string
        format: uri
        description: >-
          URI of the person interviewed or narrating (schema:interviewee). Must reference an
          ogc.heritage.actor record. Required.
      language:
        type: string
        description: >-
          BCP 47 language code of the recording, e.g. "mt", "en", "it" (crm:P72_has_language).
          Required.
      consentStatus:
        type: string
        description: >-
          Consent and access status of the recording, e.g. "consented — public access",
          "consented — restricted to researchers", "anonymised", "pending consent review"
          (dct:accessRights). Required for legal compliance.
      iiifManifest:
        type: string
        format: uri
        description: >-
          URI of an IIIF Presentation API 3 manifest for this recording, enabling playback
          and timed annotation in IIIF viewers (crm:P70i_is_documented_in). Required.
      mediaType:
        type: string
        description: >-
          IANA media type of the recording file (dct:format), e.g. "audio/mp4", "audio/mpeg",
          "video/mp4". Required; must be an audio/* or video/* type.
        pattern: "^(audio|video)/"
      rights:
        type: string
        description: >-
          Licence or copyright statement (dct:rights), e.g. a Creative Commons URI or
          "All rights reserved — Heritage Malta". Required.
      transcriptUri:
        type: string
        format: uri
        description: >-
          URI of a text transcript of the recording (crm:P70i_is_documented_in).
      duration:
        type: string
        description: >-
          Duration of the recording in ISO 8601 duration format (schema:duration),
          e.g. "PT1H23M45S".
      contributor:
        oneOf:
          - type: string
            format: uri
          - type: array
            items:
              type: string
              format: uri
        description: >-
          URI(s) of other persons or organisations who contributed to the recording
          (dct:contributor), e.g. interviewer, sound technician, transcriber.
      theme:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
        description: >-
          Thematic keywords or controlled-vocabulary terms describing the recording's subject
          matter (dct:subject), e.g. "domestic life", "World War II occupation", "garden traditions".
      historicalPeriod:
        type: string
        description: >-
          The historical period or date range addressed in the narrative (crm:P4_has_time-span),
          e.g. "1940–1945", "interwar period".
