examples:
  - title: A documented restoration intervention
    content: >-
      A 2024 restoration of the Great Gallery ceiling painting, with a time-span, the object
      worked on, the conservator who carried it out, and the place where it happened.
    snippets:
      - language: json
        ref: examples/restoration.json

  - title: A minimal record for an undated legacy intervention
    content: >-
      Only `identifier` is required at this level — older archive records (UC-V-3) may carry
      nothing more than a reference to a paper conservation log, with detail added incrementally.
    snippets:
      - language: json
        ref: examples/minimal.json

  - title: Malta historical foundation event (HM-09)
    content: >-
      The 1820 foundation of the Villa Portelli estate, typed as a ceremony/foundation event
      (Getty AAT), with the Portelli family as the associated actor and the villa site as the
      location. `description` carries a free-text historical significance note. Demonstrates
      use of the event block for historical (non-conservation) events, covering the Malta
      pilot's HM-09 requirement for historical events with organisational and significance
      context.
    snippets:
      - language: json
        ref: examples/malta-ceremony.json
