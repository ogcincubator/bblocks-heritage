examples:
  - title: Venaria — TLS point cloud of Galleria Grande ceiling
    content: >-
      A terrestrial laser scan point cloud of the Galleria Grande ceiling, with acquisition
      metadata (method, equipment, accuracy) and a polygon coverage geometry.
    snippets:
      - language: json
        ref: examples/venaria-gc-ceiling-tls.json

  - title: Malta — UAV photogrammetric model of Villa Portelli exterior
    content: >-
      A UAV photogrammetric model of the Villa Portelli exterior, with acquisition metadata
      and a persistent DOI identifier alongside the record's own URI.
    snippets:
      - language: json
        ref: examples/malta-villa-portelli-uav.json

  - title: Venaria — TLS scan of Galleria Grande bay 7 vault, coverage by reference (geometry-by-reference / topology)
    content: >-
      A TLS scan whose coverage coincides exactly with the surveyed bay's own footprint
      (see ogc.heritage.architectural-space's galleria-grande-bay.json). Instead of
      re-encoding the same polygon as `coverage`, this record uses `references` — the
      geometry-by-reference pattern from ogc.ogc-utils.topology — to point at the surveyed
      space directly.
    snippets:
      - language: json
        ref: examples/gg-bay7-vault-tls-shared-coverage.json
