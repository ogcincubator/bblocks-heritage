examples:
  - title: A glTF-binary 3D model of a painting's frame
    content: >-
      A photogrammetry-derived glTF model documenting the Great Gallery ceiling painting in 3D.
    snippets:
      - language: json
        ref: examples/gltf.json

  - title: Malta artefact 3D model in glTF JSON format (HM-04)
    content: >-
      A 3D scan of the south balustrade at Villa Portelli (Malta pilot), exported as
