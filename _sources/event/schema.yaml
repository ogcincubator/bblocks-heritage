$schema: https://json-schema.org/draft/2020-12/schema
title: Event
description: |
  An event in the history of a heritage object — production, restoration, modification,
  acquisition — modelled as a CIDOC-CRM E5 Event. Profiles PROV-O's Activity: `startedAtTime`/
  `endedAtTime` carry the time-span (P4_has_time-span), `wasAssociatedWith` the actors who
  carried it out (P14_carried_out_by), `used`/`generated` the objects involved (P16_used_specific_object
  / P108_has_produced / P31_has_modified) and `atLocation` where it took place (P7_took_place_at).
  This block adds a local identifier and a CIDOC-CRM event type.
x-jsonld-context: context.jsonld
allOf:
  - "$ref": bblocks://ogc.ogc-utils.prov-activity
  - type: object
    required:
      - id
    properties:
      identifier:
        type: string
        description: A local identifier for this event (CIDOC-CRM P1_is_identified_by).
      eventType:
        type: string
        format: uri
        description: >-
          The type of event, typically a Getty AAT concept URI, e.g. production or restoration
          (CIDOC-CRM P2_has_type). Set to an HDTO class URI (hdto:HC11_Digital_Twin_Maintenance /
          hdto:HC13_Project) to identify this event as a digital-twin-maintenance or project
          activity — see `hdtoType` below, required in that case.
      hdtoType:
        type: string
        enum:
          - hdto:HC11_Digital_Twin_Maintenance
          - hdto:HC13_Project
        description: >-
          HDTO co-type (D7.1). Maps via context directly to rdf:type. Not applicable to most
          events (an ordinary production/restoration/acquisition has no HC11/HC13 counterpart) —
          required only when eventType is itself set to the matching HDTO class URI (see the
          `if`/`then` blocks below), since nothing about an Event's CRM/PROV-O type alone
          distinguishes a digital-twin-maintenance or project activity from any other event.
  - if:
      properties:
        eventType:
          const: http://isl.ics.forth.gr/ontology/echoes/HC11_Digital_Twin_Maintenance
      required:
        - eventType
    then:
      required:
        - hdtoType
      properties:
        hdtoType:
          const: hdto:HC11_Digital_Twin_Maintenance
  - if:
      properties:
        eventType:
          const: http://isl.ics.forth.gr/ontology/echoes/HC13_Project
      required:
        - eventType
    then:
      required:
        - hdtoType
      properties:
        hdtoType:
          const: hdto:HC13_Project
