examples:
  - title: Venaria — triangulated mesh derived from TLS point cloud of Galleria Grande ceiling
    content: >-
      A triangulated mesh generated from the Galleria Grande ceiling TLS point cloud, with
      the PROV derivation link back to the source survey dataset and a structured
      processing event recording the mesh-generation method, software and QA result.
    snippets:
      - language: json
        ref: examples/venaria-gc-ceiling-mesh.json

  - title: Malta — deviation map derived from UAV photogrammetric survey of Villa Portelli exterior
    content: >-
      A facade deviation map derived from the Villa Portelli UAV photogrammetric survey,
      comparing the surveyed geometry against a design BIM reference mesh, with a
      persistent DOI alongside the record's own URI.
    snippets:
      - language: json
        ref: examples/malta-villa-portelli-deviation-map.json
