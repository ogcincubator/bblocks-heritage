$schema: https://json-schema.org/draft/2020-12/schema
title: Fabrication Output
description: |
  A `digital-representation` constrained to physical-fabrication formats — STL or 3MF — produced
  from a source 3D model, with a mandatory PROV derivation chain (`wasDerivedFrom`) back to that
  source (D8.2 profile F: physical replicas, tactile reproductions).
allOf:
  - "$ref": bblocks://ogc.heritage.digital-representation
  - type: object
    required:
      - mediaType
      - wasDerivedFrom
    properties:
      hdtoType:
        const: hdto:HC5_Digital_Representation
        description: >-
          Pins the inherited hdtoType (from digital-representation, otherwise an enum of
          HC5/HC7/HC8) to HC5: this block models the digital fabrication file (STL/3MF) itself,
          not the physical 3D-printed artifact it produces — the latter, if ever recorded, would
          be a separate heritage-object-family (HC3) record, out of scope for this block.
      mediaType:
        type: string
        enum:
          - model/stl
          - model/3mf
        description: "`model/stl` for STL or `model/3mf` for 3D Manufacturing Format."
