$schema: https://json-schema.org/draft/2020-12/schema
title: Surface
description: >-
  A material finish layer or physical surface feature recognised on an architectural
  component or heritage object (CIDOC-CRM E25 Man-Made Feature). Records the host object,
  material and technique (Getty AAT), historical phase, exposure context and a mandatory
  polygon or surface-patch geometry — embedded, or given by reference to shared/topological
  geometry (see ogc.ogc-utils.topology). May be linked to a condition-assessment record for
  pathology documentation.
x-jsonld-context: context.jsonld
type: object
required:
  - id
  - type
  - hostObject
  - material
oneOf:
  - type: object
    description: Surface with its own embedded footprint geometry.
    properties:
      footprint:
        type: object
        description: >-
          GeoJSON Geometry delineating the spatial extent of this surface as a polygon
          or surface-patch. Coordinates should be in the reference system of the
          host structure's survey (local or EPSG:4326). Maps to geojson:geometry.
        properties:
          type:
            type: string
            enum: [Polygon, MultiPolygon]
          coordinates:
            type: array
        required:
          - type
          - coordinates
    required:
      - footprint
    not:
      required:
        - references
  - "$ref": bblocks://ogc.ogc-utils.topology
properties:
  id:
    type: string
    format: uri
    description: Persistent URI identifying this surface record.
  type:
    const: Surface
    description: Fixed type token identifying this record as a surface (maps to crm:E25_Man-Made_Feature).
  hostObject:
    type: string
    format: uri
    description: >-
      URI of the heritage-object, architectural-space or building that this surface
      is recognised on (crm:P56i_is_found_on).
  material:
    type: string
    format: uri
    description: >-
      Getty AAT URI for the primary surface material, e.g.:
      painted plaster (300014927), stucco (300014927), stone (300011176),
      fresco (300177433), gold leaf (300263998).
      Maps to crm:P45_consists_of.
  technique:
    type: string
    format: uri
    description: >-
      Getty AAT URI for the application or fabrication technique, e.g.:
      fresco (300053343), oil painting (300178684), polishing (300053344).
      Maps to crm:P33_used_specific_technique.
  historicalPhase:
    type: string
    description: >-
      Date or period label of the phase in which this surface was applied or last
      significantly altered, e.g. "1690–1710", "post-1945 restoration".
      Maps to crm:P4_has_time-span.
  exposure:
    type: string
    description: >-
      Positional context of the surface within the architectural element, e.g.
      "vault intrados", "north wall", "floor", "exterior facade".
      Maps to crm:P3_has_note.
  conditionSummary:
    type: string
    description: >-
      Brief description of the current conservation condition of this surface,
      e.g. "stable", "localised cracking", "active moisture ingress".
      Maps to crm:P44_has_condition.
  conditionAssessment:
    type: string
    format: uri
    description: >-
      URI of a condition-assessment record (ogc.heritage.condition-assessment)
      that provides detailed pathology documentation for this surface.
  sourceEvidence:
    type: string
    format: uri
    description: >-
      URI of the archival or survey source (ogc.heritage.source-carrier or
      ogc.heritage.digital-surrogate) that documents this surface's existence
      and attributes. Maps to crm:P70i_is_documented_in.
  reviewStatus:
    type: string
    description: >-
      Workflow status of this record, e.g. "draft", "reviewed", "approved".
