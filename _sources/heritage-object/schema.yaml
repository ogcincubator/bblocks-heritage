$schema: https://json-schema.org/draft/2020-12/schema
title: Heritage Object
description: |
  A physical cultural heritage item (artwork, building element, garden feature, museum object...),
  modelled as a CIDOC-CRM E22 Man-Made Object.
x-jsonld-context: context.jsonld
$defs:
  properties:
    type: object
    properties:
      identifier:
        type: string
        description: A local catalogue or inventory number (CIDOC-CRM P1_is_identified_by).
      title:
        type: string
        description: A human-readable title or name for the object (CIDOC-CRM P102_has_title).
      description:
        type: string
        description: Free-text description or curatorial note (CIDOC-CRM P3_has_note).
      objectType:
        type: string
        format: uri
        description: >-
          The type of object, typically a Getty AAT concept URI
          (CIDOC-CRM P2_has_type).
      material:
        type: array
        description: >-
          Materials the object consists of, typically Getty AAT concept URIs
          (CIDOC-CRM P45_consists_of).
        items:
          type: string
          format: uri
      currentLocation:
        type: string
        format: uri
        description: >-
          URI of the place where the object is currently or was last located
          (CIDOC-CRM P53_has_former_or_current_location).
      persistentIdentifier:
        type: string
        format: uri
        description: A persistent identifier (e.g. ARK, DOI, Handle) minted for this object.
      hdtoType:
        type: string
        const: hdto:HC3_Tangible_Heritage_Entity
        description: >-
          Fixed HDTO co-type (ECCCH Heritage Digital Twin Ontology, D7.1). Maps via context
          directly to rdf:type, alongside crm:E22_Man-Made_Object — additive, not a replacement
          (D7.1 Figure 20's own worked example shows the same node typed as both classes at once).
          Required so every valid instance is HDTO-typed on a plain JSON-LD parse, with no extra
          post-processing step needed.
    required:
      - identifier
      - title
      - hdtoType
type: object
allOf:
  - type: object
    properties:
      id:
        type: string
        format: uri
        description: The persistent or local URI identifying this object.
      type:
        const: HeritageObject
    required:
      - id
      - type
  - "$ref": "#/$defs/properties"
