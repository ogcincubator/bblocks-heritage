examples:
  - title: Baroque fresco vault surface, Galleria Grande Bay 7 — Venaria (CRRS-005)
    content: >-
      The painted fresco plaster of vault bay 7 in the Galleria Grande at Reggia di Venaria.
      Material (fresco, Getty AAT 300178433) and technique (fresco secco, Getty AAT 300053343)
      are expressed via controlled terms. A polygon footprint delineates the bay extent.
      Includes links to a photogrammetric survey product (sourceEvidence) and a condition
      assessment record. Covers CRRS-005 (surface / finish layer).
    snippets:
      - language: json
        ref: examples/venaria-vault-fresco.json

  - title: Stone floor surface, Grand Salon — Villa Portelli, Malta
    content: >-
      The limestone floor surface of the Grand Salon at Villa Portelli. A minimal example
      — only type, hostObject, material and footprint are provided — demonstrating the
      required fields. Material is mapped to the Getty AAT stone concept (300011176).
    snippets:
      - language: json
        ref: examples/malta-grand-salon-floor.json

  - title: Vault fresco with extent by reference (geometry-by-reference / topology)
    content: >-
      The fresco covering the vault of Galleria Grande bay 7 extends across the entire bay,
      so its spatial extent coincides exactly with the bay's own footprint
      (galleria-grande-bay.json) rather than a separately-drawn polygon. No `footprint` is
      given here — instead `references` points at the hostObject's own record, using the
      geometry-by-reference pattern from ogc.ogc-utils.topology to avoid duplicating
      coordinates.
    snippets:
      - language: json
        ref: examples/venaria-vault-fresco-shared-footprint.json
