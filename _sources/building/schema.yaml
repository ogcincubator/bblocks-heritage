$schema: https://json-schema.org/draft/2020-12/schema
title: Building
description: |
  A principal building or architectural unit (palace wing, chapel, outbuilding, villa)
  modelled as a CIDOC-CRM E22 Man-Made Object. Profiles ogc.heritage.heritage-object and
  adds site containment, construction history, operational status, optional IFC cross-reference
  and an optional GeoJSON footprint geometry.

  Instances have type "HeritageObject" (inherited); the building category is conveyed through
  objectType pointing to a Getty AAT architectural concept.
x-jsonld-context: context.jsonld
allOf:
  - $ref: bblocks://ogc.heritage.heritage-object
  - type: object
    oneOf:
      - type: object
        description: Building with its own embedded footprint geometry (or none at all).
        not:
          required:
            - references
      - "$ref": bblocks://ogc.ogc-utils.topology
    properties:
      parentSite:
        type: string
        format: uri
        description: >-
          URI of the heritage-site this building belongs to
          (crm:P46i_forms_part_of).
      constructionPeriod:
        type: string
        description: >-
          Date or date range of original construction, ISO 8601 or free text
          (e.g. "1675-1690"). Maps to dct:created.
      currentStatus:
        type: string
        description: >-
          Operational or conservation status (e.g. "in use", "under restoration",
          "closed"). Maps to crm:P44_has_condition.
      responsibleOrganisation:
        type: string
        description: >-
          Name or URI of the body responsible for managing this building
          (crm:P50_has_current_keeper).
      ifcGlobalId:
        type: string
        description: >-
          IFC Global ID (GUID) of the corresponding IfcBuilding element in an
          HBIM model, when available (crm:P1_is_identified_by).
      footprint:
        type: object
        description: >-
          Optional GeoJSON geometry representing the building's ground-level
          footprint or spatial extent.
        properties:
          type:
            type: string
            enum: [Point, Polygon, MultiPolygon]
          coordinates:
            type: array
        required:
          - type
          - coordinates
