$schema: https://json-schema.org/draft/2020-12/schema
title: Heritage Proposition Set
description: |
  HDTO's HC16 Heritage Proposition Set (⊑ crminf:I4 Proposition Set + HC15 Persistent Digital
  Object): the named-graph content unit a `heritage-digital-twin` (HC2) actually "contains" via
  HP33/HP34. Per D7.1's own worked example (Figures 16-17), a real HC16 instance is a
  provenance-linked graph (digitization/study process → software/device → data output), not a
  flat metadata bag — modelling that full CRMdig process chain is deliberately deferred (see
  `description.md`); this schema covers the flat "what does this set assert, and about what" shape
  needed to make HC2 usable now, with `content` as the extension point for deeper chains later.
x-jsonld-context: context.jsonld
type: object
required:
  - id
  - type
  - content
  - composedBy
properties:
  id:
    type: string
    format: uri
    description: Persistent URI identifying this proposition set (named graph).
  type:
    const: HeritagePropositionSet
    description: Fixed type token (maps to hdto:HC16_Heritage_Proposition_Set).
  label:
    type: string
    description: Short human-readable label for this proposition set, e.g. naming the digitization/study batch it captures.
  content:
    type: array
    minItems: 1
    items:
      type: string
      format: uri
    description: >-
      URIs of the register entities this proposition set's assertions are about or derived from
      (e.g. `digital-representation`/`three-d-model`/`survey-dataset`/`observation` instances it
      aggregates as evidence for the documented `heritage-object`). Modelled as a flat reference
      list (crm:P148_has_component) — the deeper process/software/device provenance chain D7.1's
      worked example shows (D2 Digitization Process, D14 Software, D6 Digital Device, D9 Data
      Object) is not modelled here; see `description.md`.
  composedBy:
    type: string
    format: uri
    description: >-
      URI of the `event` instance (co-typed hdto:HC11_Digital_Twin_Maintenance) that added this
      proposition set (HP30 added content, inverse direction — HP30i). Required: every
      proposition set exists because some maintenance activity produced it.
  replaces:
    type: string
    format: uri
    description: >-
      URI of the `heritage-proposition-set` this one supersedes within the same digital twin's
      version chain (HP32 replaced).
