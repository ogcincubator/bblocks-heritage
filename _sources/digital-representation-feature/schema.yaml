$schema: https://json-schema.org/draft/2020-12/schema
title: Digital Representation Feature
description: >-
  Feature-envelope wrapper for ogc.heritage.digital-representation: a spatially located
  digital asset encoded as a GeoJSON/JSON-FG Feature, or as an ogc.geo.topo.features.topo-feature
  when its geometry is defined by reference/topology rather than embedded coordinates.
  PROV-O's prov-entity (id, provType, wasAttributedTo, wasGeneratedBy, wasDerivedFrom, ...)
  is inherited flat at the top level, since prov-entity does not fix `type` to a specific
  class the way ogc.heritage.heritage-object does; digital-representation's own additions
  (isAbout, mediaType, persistentIdentifier, url) nest under `properties`, per GeoJSON
  convention. Like digital-representation itself, this block asserts no fixed CIDOC-CRM
  class of its own — `properties.choType` is required but left open (no `const`) for
  concrete profiles (e.g. ogc.heritage.survey-dataset) to pin to their own class, the same
  way digital-representation's other profiles (digital-surrogate, oral-history,
  derived-survey-product) each pin their own `type`.
x-jsonld-context: context.jsonld
allOf:
  - "$ref": bblocks://ogc.ogc-utils.prov-entity
  - oneOf:
      - allOf:
          - "$ref": bblocks://ogc.geo.json-fg.feature-lenient
          - type: object
            description: >-
              Digital representation with its own embedded footprint geometry (or none
              at all).
            not:
              required:
                - topology
      - "$ref": bblocks://ogc.geo.topo.features.topo-feature
  - type: object
    required:
      - id
    properties:
      id:
        type: string
        format: uri
        description: >-
          Persistent URI identifying this record (overrides the inherited `id`, which
          also allows a bare number or non-URI string).
      properties:
        allOf:
          - "$ref": ../digital-representation/schema.yaml#/$defs/properties
          - type: object
            required:
              - choType
            properties:
              choType:
                type: string
                description: >-
                  CIDOC-CRM (or CRMdig) class discriminator for this record, a second alias
                  to @type alongside the fixed GeoJSON `type: "Feature"`. Left open here;
                  concrete profiles of this block pin it to their own class (e.g.
                  `"SurveyDataset"` in ogc.heritage.survey-dataset).
